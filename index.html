<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Claude와 Codex로 만든 AI 자동화 랜딩 페이지 버전 비교">
    <title>AI 자동화 랜딩 페이지 버전 선택</title>
    <style>
      :root {
        --bg: #080a12;
        --surface: rgba(255, 255, 255, 0.06);
        --line: rgba(255, 255, 255, 0.12);
        --text: #f7f8fb;
        --muted: #aab4c8;
        --purple: #7c3aed;
        --blue: #60a5fa;
        --radius: 8px;
        --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(circle at 20% 12%, rgba(124, 58, 237, 0.34), transparent 28rem),
          radial-gradient(circle at 85% 20%, rgba(96, 165, 250, 0.24), transparent 24rem),
          linear-gradient(180deg, #080a12 0%, #0b1020 100%);
        color: var(--text);
        font-family: var(--font);
      }

      main {
        width: min(920px, calc(100% - 2rem));
        padding: 4rem 0;
      }

      .eyebrow {
        margin: 0 0 0.8rem;
        color: #bfdbfe;
        font-size: 0.92rem;
        font-weight: 800;
      }

      h1 {
        max-width: 760px;
        margin: 0 0 1rem;
        font-size: clamp(2.2rem, 7vw, 4.6rem);
        font-weight: 950;
        letter-spacing: 0;
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
      }

      .versions {
        display: grid;
        gap: 1rem;
        margin-top: 2.4rem;
      }

      .card {
        display: grid;
        gap: 1rem;
        min-height: 13rem;
        align-content: space-between;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 1.35rem;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
      }

      .card h2 {
        margin: 0 0 0.5rem;
        font-size: 1.4rem;
      }

      .button {
        display: inline-flex;
        min-height: 3rem;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius);
        background: linear-gradient(135deg, var(--purple), var(--blue));
        color: white;
        font-weight: 900;
        text-decoration: none;
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .button:hover,
      .button:focus-visible {
        box-shadow: 0 0 0 5px rgba(96, 165, 250, 0.13), 0 22px 58px rgba(96, 165, 250, 0.28);
        outline: none;
        transform: translateY(-2px);
      }

      @media (min-width: 768px) {
        .versions {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">AI 자동화 6주 과정 랜딩 페이지</p>
      <h1>랜딩 페이지 버전을 선택하세요</h1>
      <p>Claude 버전과 Codex 버전을 각각 보존했습니다. GitHub Pages에서는 아래 경로로 두 결과물을 따로 확인할 수 있습니다.</p>

      <section class="versions" aria-label="랜딩 페이지 버전 선택">
        <article class="card">
          <div>
            <h2>Claude 버전</h2>
            <p>GitHub 원격 저장소에 있던 기존 랜딩 페이지입니다.</p>
          </div>
          <a class="button" href="./claude/">Claude 버전 보기</a>
        </article>

        <article class="card">
          <div>
            <h2>Codex 버전</h2>
            <p>현재 Codex에서 만든 단일 HTML 랜딩 페이지입니다.</p>
          </div>
          <a class="button" href="./codex/">Codex 버전 보기</a>
        </article>
      </section>
    </main>
  </body>
</html>
